[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-active-learning"
version = "0.1.0"
authors = [
  { name="Senior AI Researcher", email="researcher@example.com" },
]
description = "A professional framework for Active Learning in Medical Image Segmentation"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.9",
]

[project.urls]
"Homepage" = "https://github.com/example/medical-active-learning"
"Bug Tracker" = "https://github.com/example/medical-active-learning/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
